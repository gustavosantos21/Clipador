[project]
name = "clipador"
version = "0.1.0"
description = "Ferramenta de clipagem e edição de vídeo dirigida por receitas JSON (YouTube, Shorts, Reels, TikTok)"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
transcricao = ["faster-whisper"]
rosto = ["opencv-python-headless>=4.8,<5"]
web = ["starlette>=0.39", "uvicorn"]
publicar = ["google-api-python-client", "google-auth-oauthlib"]
tudo = ["faster-whisper", "opencv-python-headless>=4.8,<5", "starlette>=0.39", "uvicorn",
        "google-api-python-client", "google-auth-oauthlib"]
dev = ["pytest", "scikit-image"]

[project.scripts]
clipador = "clipador.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clipador"]

[tool.setuptools.package-data]
clipador = ["web/*.html"]
